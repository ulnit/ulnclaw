<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ulnclaw</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="sidebar-header">
          <span class="wordmark">ulnclaw</span>
          <span id="gateway-dot" class="dot" title="gateway status" data-i18n-title="chrome.gatewayStatus"></span>
        </div>
        <div class="view-tabs">
          <button id="tab-chat" class="tab active" data-i18n="chrome.chatTab">Chat</button>
          <button id="tab-kanban" class="tab" data-i18n="chrome.kanbanTab">Kanban</button>
          <button id="tab-projects" class="tab" data-i18n="chrome.projectsTab">Projects</button>
          <button id="tab-jobs" class="tab" data-i18n="chrome.jobsTab">Jobs</button>
          <button id="tab-usage" class="tab" data-i18n="chrome.usageTab">Usage</button>
          <button id="tab-config" class="tab" data-i18n="chrome.configTab">Config</button>
          <button id="tab-doctor" class="tab" data-i18n="chrome.doctorTab">Doctor</button>
          <button id="tab-webhooks" class="tab" data-i18n="chrome.webhooksTab">Webhooks</button>
          <button id="tab-runs" class="tab" data-i18n="chrome.runsTab">Runs</button>
          <button id="tab-skills" class="tab" data-i18n="chrome.skillsTab">Skills</button>
          <button id="tab-sessions-view" class="tab" data-i18n="chrome.sessionsTab">Sessions</button>
          <button id="tab-models" class="tab" data-i18n="chrome.modelsTab">Models</button>
          <button id="tab-plugins" class="tab" data-i18n="chrome.pluginsTab">Plugins</button>
          <button id="tab-pairing" class="tab" data-i18n="chrome.pairingTab">Pairing</button>
          <button id="tab-profiles" class="tab" data-i18n="chrome.profilesTab">Profiles</button>
        </div>
        <button id="new-session" class="primary" data-i18n="chrome.newSession">New session</button>
        <div class="session-toolbar">
          <input id="session-filter" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="session.filterPlaceholder" placeholder="Filter sessions…" />
          <button id="session-sort" class="ghost icon-btn" title="Sort sessions" data-i18n-title="session.sortByActivity"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5.5"/><path d="M8 5.2v2.8l2 1.5"/></svg></button>
          <button id="session-archived" class="ghost icon-btn" title="Toggle archived sessions" data-i18n-title="session.hideArchived"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="3" rx="1"/><path d="M3.5 6v6A1.5 1.5 0 0 0 5 13.5h6a1.5 1.5 0 0 0 1.5-1.5V6"/><path d="M6.5 8.5h3"/></svg></button>
        </div>
        <div id="session-list" tabindex="0"></div>
        <div class="sidebar-footer">
          <button id="notify-bell" class="ghost icon-btn notify-bell" title="Notifications" data-i18n-title="notify.historyTitle"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.2a4 4 0 0 0-4 4v2.4L2.8 11h10.4L12 8.6V6.2a4 4 0 0 0-4-4Z"/><path d="M6.6 13.2a1.5 1.5 0 0 0 2.8 0"/></svg><span id="notify-badge" class="notify-badge" hidden></span></button>
          <button id="shell-react-btn" class="ghost" title="Try the React shell (beta)">React β</button>
          <button id="settings-btn" class="ghost" data-i18n="chrome.settings">Settings</button>
        </div>
      </aside>
      <main id="chat">
        <header id="chat-header">
          <span id="chat-title" data-i18n="chrome.selectOrStart">Select or start a session</span>
          <span id="chat-busy" class="chat-busy" hidden></span>
          <span id="model-badge"></span>
          <span id="token-badge" hidden></span>
          <button id="reasoning-badge" class="ghost" type="button" hidden></button>
          <div id="reasoning-pop" class="slash-pop" hidden></div>
          <button id="personality-badge" class="ghost" type="button" hidden></button>
          <div id="personality-pop" class="slash-pop" hidden></div>
          <button id="fast-badge" class="ghost" type="button" hidden></button>
          <div id="fast-pop" class="slash-pop" hidden></div>
          <button id="approvals-badge" class="ghost" type="button" hidden></button>
          <div id="approvals-pop" class="slash-pop" hidden></div>
          <span id="project-badge" hidden></span>
          <span id="end-badge" class="session-end-badge" hidden></span>
          <span id="context-meter" hidden><span id="context-meter-bar"><span id="context-meter-fill"></span></span><span id="context-meter-text"></span></span>
          <div id="context-pop" class="slash-pop" hidden></div>
          <select id="day-jump" hidden data-i18n-title="session.dayJumpTitle" title="Jump to date"></select>
          <button id="chat-file-tree" class="ghost icon-btn" type="button" data-i18n-title="fileTree.openTitle" title="Toggle the file tree"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h2.8l1.4 1.8h4.8A1.5 1.5 0 0 1 14 6.3v6.2a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 12.5Z"/></svg></button>
          <span id="chat-header-actions" hidden>
            <button id="chat-rename" class="ghost icon-btn" type="button" data-i18n-title="palette.renameSession" title="Rename session"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9.7 3.6 2.7 2.7L5.6 13l-3.1.5L3 10.4Z"/><path d="m8.6 4.7 2.7 2.7"/></svg></button>
            <button id="chat-fork" class="ghost icon-btn" type="button" data-i18n-title="palette.forkSession" title="Fork session"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="4.5" cy="3.8" r="1.6"/><circle cx="4.5" cy="12.2" r="1.6"/><circle cx="11.5" cy="3.8" r="1.6"/><path d="M4.5 5.4v5.2"/><path d="M11.5 5.4a3.5 3.5 0 0 1-3.5 3.5H6.2"/></svg></button>
            <button id="chat-archive" class="ghost icon-btn" type="button" data-i18n-title="palette.archiveSession" title="Archive session"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="3" rx="1"/><path d="M3.5 6v6A1.5 1.5 0 0 0 5 13.5h6a1.5 1.5 0 0 0 1.5-1.5V6"/><path d="M6.5 8.5h3"/></svg></button>
            <button id="chat-export" class="ghost icon-btn" type="button" data-i18n-title="palette.exportMd" title="Export Markdown"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v7.5m0 0 3-3m-3 3-3-3"/><path d="M3 13h10"/></svg></button>
            <button id="chat-delete" class="ghost icon-btn danger" type="button" data-i18n-title="palette.deleteSession" title="Delete session"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.2h10"/><path d="M6.3 4V2.8h3.4V4"/><path d="M4.4 4.2 5 13.2h6l.6-9"/><path d="M6.6 6.5v4.5M9.4 6.5v4.5"/></svg></button>
          </span>
        </header>
        <div id="chat-body"><div id="messages"></div></div>
        <button id="scroll-bottom" class="scroll-bottom" hidden title="Scroll to bottom" data-i18n-title="chrome.scrollBottom"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v9.5m0 0 3.5-3.5M8 12.5 4.5 9"/></svg></button>
        <div id="tool-progress" class="tool-progress" hidden></div>
        <footer id="composer">
          <div id="slash-pop" class="slash-pop" hidden></div>
          <div id="attach-chips" class="attach-chips" hidden></div>
          <textarea id="input" rows="3" placeholder="Message ulnclaw… (Enter to send, Shift+Enter for newline)" data-i18n-ph="chrome.inputPlaceholder"></textarea>
          <button id="attach-file" class="ghost icon-btn" title="Attach file" data-i18n-title="chrome.attachTitle"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.6 4.6 5.2 9a2 2 0 0 0 2.9 2.9l4.4-4.4a3.4 3.4 0 0 0-4.8-4.8L3.4 7"/></svg></button>
          <button id="mic" class="ghost icon-btn" title="Voice input" data-i18n-title="chrome.micTitle"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="4" height="7" rx="2"/><path d="M4 8.2a4 4 0 0 0 8 0"/><path d="M8 12.2v1.8"/></svg></button>
          <span id="char-count" class="char-count" hidden data-i18n-title="chrome.charCountTitle" title="Character count"></span>
          <button id="busy-mode" class="ghost icon-btn busy-mode" type="button" hidden title="Busy behavior" data-i18n-title="busy.titlePlain"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.8 2.2h6.4M4.8 13.8h6.4"/><path d="M5.6 2.2v2L8 7l2.4-2.8v-2M5.6 13.8v-2L8 9l2.4 2.8v2"/></svg></button>
          <button id="send" class="primary" data-i18n="chrome.send">Send</button>
        </footer>
      </main>
      <main id="kanban" hidden></main>
      <main id="projects" hidden></main>
      <main id="jobs" hidden></main>
      <main id="usage" hidden></main>
      <main id="config" hidden></main>
      <main id="doctor" hidden></main>
      <main id="webhooks" hidden></main>
      <main id="runs" hidden></main>
      <main id="skills" hidden></main>
      <main id="sessions-view" hidden></main>
      <main id="models" hidden></main>
      <main id="plugins" hidden></main>
      <main id="pairing" hidden></main>
      <main id="profiles" hidden></main>
      <footer id="statusbar" hidden></footer>
      <dialog id="settings">
        <form method="dialog">
          <h2 data-i18n="chrome.settingsTitle">Gateway settings</h2>
          <label><span data-i18n="chrome.gatewayUrl">Gateway URL</span>
            <input id="setting-url" type="text" placeholder="http://127.0.0.1:8642" />
          </label>
          <label><span data-i18n="chrome.apiKey">API key (optional, [gateway] key)</span>
            <input id="setting-key" type="password" placeholder="bearer token" data-i18n-ph="chrome.bearerToken" />
          </label>
          <label class="check">
            <input id="setting-manage" type="checkbox" />
            <span data-i18n="chrome.manageProcess">Manage the gateway process (start/stop with the app)</span>
          </label>
          <label class="check" id="setting-autostart-row">
            <input id="setting-autostart" type="checkbox" />
            <span data-i18n="chrome.autostart">Launch ulnclaw at login</span>
          </label>
          <label class="check">
            <input id="setting-reopen" type="checkbox" />
            <span data-i18n="chrome.reopenLast">Reopen the last session at launch</span>
          </label>
          <label><span data-i18n="chrome.charWarn">Composer warn threshold (characters)</span>
            <input id="setting-char-warn" type="number" min="100" step="100" />
          </label>
          <label><span data-i18n="chrome.charLimit">Composer hard limit (characters, 0 = off)</span>
            <input id="setting-char-limit" type="number" min="0" step="100" />
          </label>
          <label class="check">
            <input id="setting-notify-system" type="checkbox" />
            <span data-i18n="chrome.notifySystem">System notification when a run finishes</span>
          </label>
          <label class="check">
            <input id="setting-chime" type="checkbox" />
            <span data-i18n="chrome.completionChime">Play a chime when a turn completes</span>
          </label>
          <label class="check" id="setting-hide-tray-row">
            <input id="setting-hide-tray" type="checkbox" />
            <span data-i18n="chrome.hideToTray">Hide to tray on close instead of quitting</span>
          </label>
          <label><span data-i18n="chrome.settingsTheme">Theme</span>
            <select id="setting-theme"></select>
          </label>
          <label><span data-i18n="chrome.settingsFont">Font</span>
            <select id="setting-font"></select>
          </label>
          <label id="setting-personality-row" hidden><span data-i18n="chrome.settingsPersonality">Personality</span>
            <select id="setting-personality"></select>
          </label>
          <menu>
            <button id="settings-shortcuts" value="cancel" data-i18n="chrome.shortcuts">Keyboard shortcuts</button>
            <button id="settings-onboarding" value="cancel" data-i18n="chrome.replayOnboarding">Replay onboarding</button>
            <button id="settings-restart" value="cancel" data-i18n="chrome.restartGateway" hidden>Restart gateway</button>
            <button value="cancel" data-i18n="chrome.cancel">Cancel</button>
            <button id="settings-save" value="default" data-i18n="chrome.save">Save</button>
          </menu>
        </form>
      </dialog>
      <dialog id="session-info-dialog" class="fs-dialog">
        <h2 data-i18n="session.infoTitle">Session info</h2>
        <div id="session-info-rows" class="notify-history-list"></div>
        <menu>
          <button id="session-info-copy" value="cancel" data-i18n="session.infoCopyId">Copy ID</button>
          <button value="cancel" data-i18n="chrome.shortcutsClose">Close</button>
        </menu>
      </dialog>
      <dialog id="notify-history-dialog" class="fs-dialog">
        <h2 data-i18n="notify.historyTitle">Notifications</h2>
        <div id="notify-history-list" class="notify-history-list"></div>
        <menu>
          <button id="notify-history-clear" value="cancel" data-i18n="notify.historyClear">Clear</button>
          <button value="cancel" data-i18n="chrome.shortcutsClose">Close</button>
        </menu>
      </dialog>
      <dialog id="shortcuts-dialog" class="fs-dialog">
        <h2 data-i18n="chrome.shortcutsTitle">Keyboard shortcuts</h2>
        <table id="shortcuts-table" class="shortcuts-table"></table>
        <menu>
          <button value="cancel" data-i18n="chrome.shortcutsClose">Close</button>
        </menu>
      </dialog>
      <dialog id="fs-dialog" class="fs-dialog">
        <h2 data-i18n="chrome.fsTitle">Attach a file</h2>
        <div class="logs-controls">
          <button id="fs-up" class="ghost icon-btn" title="Up" data-i18n-title="chrome.fsUpTitle"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3"/><path d="M4.5 6.5 8 3l3.5 3.5"/></svg></button>
          <input id="fs-path" type="text" />
          <button id="fs-go" class="ghost">Go</button>
          <button id="fs-mkdir" class="ghost icon-btn" title="New folder" data-i18n-title="chrome.fsMkdirTitle"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h2.8l1.4 1.8h4.8A1.5 1.5 0 0 1 14 6.3v6.2a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 12.5Z"/><path d="M8 7.6v4M6 9.6h4"/></svg></button>
          <button id="fs-git-root" class="ghost icon-btn" title="Repo root" data-i18n-title="chrome.fsGitRootTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg></button>
        </div>
        <div id="fs-entries" class="fs-entries"></div>
        <p id="fs-status" class="config-note"></p>
        <menu>
          <button id="fs-close" value="cancel" data-i18n="chrome.cancel">Cancel</button>
        </menu>
      </dialog>
      <dialog id="fs-preview-dialog" class="fs-dialog">
        <h2 id="fs-preview-title" data-i18n="chrome.fsPreviewTitle">Preview</h2>
        <textarea id="fs-preview-text" class="learning-node-content" spellcheck="false"></textarea>
        <p id="fs-preview-status" class="config-note"></p>
        <menu>
          <button id="fs-preview-save" data-i18n="chrome.fsPreviewSave">Save</button>
          <button id="fs-preview-close" value="cancel" data-i18n="chrome.cancel">Cancel</button>
        </menu>
      </dialog>
    </div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ulnclaw</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="sidebar-header">
          <span class="wordmark">ulnclaw</span>
          <span id="gateway-dot" class="dot" title="gateway status" data-i18n-title="chrome.gatewayStatus"></span>
        </div>
        <div class="view-tabs">
          <button id="tab-chat" class="tab active" data-i18n="chrome.chatTab">Chat</button>
          <button id="tab-kanban" class="tab" data-i18n="chrome.kanbanTab">Kanban</button>
          <button id="tab-projects" class="tab" data-i18n="chrome.projectsTab">Projects</button>
          <button id="tab-jobs" class="tab" data-i18n="chrome.jobsTab">Jobs</button>
          <button id="tab-usage" class="tab" data-i18n="chrome.usageTab">Usage</button>
          <button id="tab-config" class="tab" data-i18n="chrome.configTab">Config</button>
          <button id="tab-doctor" class="tab" data-i18n="chrome.doctorTab">Doctor</button>
          <button id="tab-webhooks" class="tab" data-i18n="chrome.webhooksTab">Webhooks</button>
          <button id="tab-runs" class="tab" data-i18n="chrome.runsTab">Runs</button>
          <button id="tab-skills" class="tab" data-i18n="chrome.skillsTab">Skills</button>
          <button id="tab-sessions-view" class="tab" data-i18n="chrome.sessionsTab">Sessions</button>
          <button id="tab-models" class="tab" data-i18n="chrome.modelsTab">Models</button>
          <button id="tab-plugins" class="tab" data-i18n="chrome.pluginsTab">Plugins</button>
          <button id="tab-pairing" class="tab" data-i18n="chrome.pairingTab">Pairing</button>
          <button id="tab-profiles" class="tab" data-i18n="chrome.profilesTab">Profiles</button>
        </div>
        <button id="new-session" class="primary" data-i18n="chrome.newSession">New session</button>
        <div class="session-toolbar">
          <input id="session-filter" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="session.filterPlaceholder" placeholder="Filter sessions…" />
          <button id="session-sort" class="ghost" title="Sort sessions" data-i18n-title="session.sortByActivity">⏱</button>
          <button id="session-archived" class="ghost" title="Toggle archived sessions" data-i18n-title="session.hideArchived">🗄</button>
        </div>
        <div id="session-list" tabindex="0"></div>
        <div class="sidebar-footer">
          <button id="notify-bell" class="ghost notify-bell" title="Notifications" data-i18n-title="notify.historyTitle">🔔<span id="notify-badge" class="notify-badge" hidden></span></button>
          <button id="settings-btn" class="ghost" data-i18n="chrome.settings">Settings</button>
        </div>
      </aside>
      <main id="chat">
        <header id="chat-header">
          <span id="chat-title" data-i18n="chrome.selectOrStart">Select or start a session</span>
          <span id="chat-busy" class="chat-busy" hidden></span>
          <span id="model-badge"></span>
          <span id="token-badge" hidden></span>
          <button id="reasoning-badge" class="ghost" type="button" hidden></button>
          <div id="reasoning-pop" class="slash-pop" hidden></div>
          <span id="project-badge" hidden></span>
          <span id="end-badge" class="session-end-badge" hidden></span>
          <span id="context-meter" hidden><span id="context-meter-bar"><span id="context-meter-fill"></span></span><span id="context-meter-text"></span></span>
          <select id="day-jump" hidden data-i18n-title="session.dayJumpTitle" title="Jump to date"></select>
          <button id="chat-file-tree" class="ghost" type="button" data-i18n-title="fileTree.openTitle" title="Toggle the file tree">🗀</button>
          <span id="chat-header-actions" hidden>
            <button id="chat-rename" class="ghost" type="button" data-i18n-title="palette.renameSession" title="Rename session">✎</button>
            <button id="chat-fork" class="ghost" type="button" data-i18n-title="palette.forkSession" title="Fork session">⑂</button>
            <button id="chat-archive" class="ghost" type="button" data-i18n-title="palette.archiveSession" title="Archive session">🗄</button>
            <button id="chat-export" class="ghost" type="button" data-i18n-title="palette.exportMd" title="Export Markdown">⭳</button>
            <button id="chat-delete" class="ghost danger" type="button" data-i18n-title="palette.deleteSession" title="Delete session">🗑</button>
          </span>
        </header>
        <div id="chat-body"><div id="messages"></div></div>
        <button id="scroll-bottom" class="scroll-bottom" hidden title="Scroll to bottom" data-i18n-title="chrome.scrollBottom">⭳</button>
        <div id="tool-progress" class="tool-progress" hidden></div>
        <footer id="composer">
          <div id="slash-pop" class="slash-pop" hidden></div>
          <div id="attach-chips" class="attach-chips" hidden></div>
          <textarea id="input" rows="3" placeholder="Message ulnclaw… (Enter to send, Shift+Enter for newline)" data-i18n-ph="chrome.inputPlaceholder"></textarea>
          <button id="attach-file" class="ghost" title="Attach file" data-i18n-title="chrome.attachTitle">📎</button>
          <button id="mic" class="ghost" title="Voice input" data-i18n-title="chrome.micTitle">🎙️</button>
          <span id="char-count" class="char-count" hidden data-i18n-title="chrome.charCountTitle" title="Character count"></span>
          <span id="char-count" class="char-count" hidden data-i18n-title="chrome.charCountTitle" title="Character count"></span>
          <button id="send" class="primary" data-i18n="chrome.send">Send</button>
        </footer>
      </main>
      <main id="kanban" hidden></main>
      <main id="projects" hidden></main>
      <main id="jobs" hidden></main>
      <main id="usage" hidden></main>
      <main id="config" hidden></main>
      <main id="doctor" hidden></main>
      <main id="webhooks" hidden></main>
      <main id="runs" hidden></main>
      <main id="skills" hidden></main>
      <main id="sessions-view" hidden></main>
      <main id="models" hidden></main>
      <main id="plugins" hidden></main>
      <main id="pairing" hidden></main>
      <main id="profiles" hidden></main>
      <footer id="statusbar" hidden></footer>
      <dialog id="settings">
        <form method="dialog">
          <h2 data-i18n="chrome.settingsTitle">Gateway settings</h2>
          <label><span data-i18n="chrome.gatewayUrl">Gateway URL</span>
            <input id="setting-url" type="text" placeholder="http://127.0.0.1:8642" />
          </label>
          <label><span data-i18n="chrome.apiKey">API key (optional, [gateway] key)</span>
            <input id="setting-key" type="password" placeholder="bearer token" data-i18n-ph="chrome.bearerToken" />
          </label>
          <label class="check">
            <input id="setting-manage" type="checkbox" />
            <span data-i18n="chrome.manageProcess">Manage the gateway process (start/stop with the app)</span>
          </label>
          <label class="check">
            <input id="setting-reopen" type="checkbox" />
            <span data-i18n="chrome.reopenLast">Reopen the last session at launch</span>
          </label>
          <label><span data-i18n="chrome.charWarn">Composer warn threshold (characters)</span>
            <input id="setting-char-warn" type="number" min="100" step="100" />
          </label>
          <label><span data-i18n="chrome.charLimit">Composer hard limit (characters, 0 = off)</span>
            <input id="setting-char-limit" type="number" min="0" step="100" />
          </label>
          <label class="check">
            <input id="setting-notify-system" type="checkbox" />
            <span data-i18n="chrome.notifySystem">System notification when a run finishes</span>
          </label>
          <label><span data-i18n="chrome.settingsTheme">Theme</span>
            <select id="setting-theme"></select>
          </label>
          <label><span data-i18n="chrome.settingsFont">Font</span>
            <select id="setting-font"></select>
          </label>
          <menu>
            <button id="settings-shortcuts" value="cancel" data-i18n="chrome.shortcuts">Keyboard shortcuts</button>
            <button id="settings-onboarding" value="cancel" data-i18n="chrome.replayOnboarding">Replay onboarding</button>
            <button id="settings-restart" value="cancel" data-i18n="chrome.restartGateway" hidden>Restart gateway</button>
            <button value="cancel" data-i18n="chrome.cancel">Cancel</button>
            <button id="settings-save" value="default" data-i18n="chrome.save">Save</button>
          </menu>
        </form>
      </dialog>
      <dialog id="session-info-dialog" class="fs-dialog">
        <h2 data-i18n="session.infoTitle">Session info</h2>
        <div id="session-info-rows" class="notify-history-list"></div>
        <menu>
          <button id="session-info-copy" value="cancel" data-i18n="session.infoCopyId">Copy ID</button>
          <button value="cancel" data-i18n="chrome.shortcutsClose">Close</button>
        </menu>
      </dialog>
      <dialog id="notify-history-dialog" class="fs-dialog">
        <h2 data-i18n="notify.historyTitle">Notifications</h2>
        <div id="notify-history-list" class="notify-history-list"></div>
        <menu>
          <button id="notify-history-clear" value="cancel" data-i18n="notify.historyClear">Clear</button>
          <button value="cancel" data-i18n="chrome.shortcutsClose">Close</button>
        </menu>
      </dialog>
      <dialog id="shortcuts-dialog" class="fs-dialog">
        <h2 data-i18n="chrome.shortcutsTitle">Keyboard shortcuts</h2>
        <table id="shortcuts-table" class="shortcuts-table"></table>
        <menu>
          <button value="cancel" data-i18n="chrome.shortcutsClose">Close</button>
        </menu>
      </dialog>
      <dialog id="fs-dialog" class="fs-dialog">
        <h2 data-i18n="chrome.fsTitle">Attach a file</h2>
        <div class="logs-controls">
          <button id="fs-up" class="ghost" title="Up" data-i18n-title="chrome.fsUpTitle">⬆</button>
          <input id="fs-path" type="text" />
          <button id="fs-go" class="ghost">Go</button>
          <button id="fs-mkdir" class="ghost" title="New folder" data-i18n-title="chrome.fsMkdirTitle">📁+</button>
          <button id="fs-git-root" class="ghost" title="Repo root" data-i18n-title="chrome.fsGitRootTitle">⎇</button>
        </div>
        <div id="fs-entries" class="fs-entries"></div>
        <p id="fs-status" class="config-note"></p>
        <menu>
          <button id="fs-close" value="cancel" data-i18n="chrome.cancel">Cancel</button>
        </menu>
      </dialog>
      <dialog id="fs-preview-dialog" class="fs-dialog">
        <h2 id="fs-preview-title" data-i18n="chrome.fsPreviewTitle">Preview</h2>
        <textarea id="fs-preview-text" class="learning-node-content" spellcheck="false"></textarea>
        <p id="fs-preview-status" class="config-note"></p>
        <menu>
          <button id="fs-preview-save" data-i18n="chrome.fsPreviewSave">Save</button>
          <button id="fs-preview-close" value="cancel" data-i18n="chrome.cancel">Cancel</button>
        </menu>
      </dialog>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

[package]
name = "ulnclaw-desktop"
version = "0.4.1"
description = "Tauri desktop shell for the ulnclaw agent"
edition = "2021"
license = "MIT"

# The workspace root Cargo.toml does not include this crate by default;
# build with `npm run tauri dev` / `npm run tauri build` from desktop/.

[lib]
name = "ulnclaw_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.48", features = ["Win32_Foundation", "Win32_System_Threading"] }

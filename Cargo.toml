[package]
name = "ulnclaw"
version = "0.2.0"
edition = "2021"
authors = ["ZStep Team"]
description = "A Rust-based AI agent engine ported from Hermes Agent (v2026.8.3)"
repository = "https://gitee.com/ushaw/ulnclaw"
license = "MIT OR Apache-2.0"
keywords = ["ai", "agent", "llm", "tool-calling"]

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "v5"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
futures = "0.3"
base64 = "0.22"
bytes = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
walkdir = "2"
glob = "0.3"
dirs = "5"
toml = "0.8"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
axum = "0.7"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.4", features = ["util"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"

[[bin]]
name = "ulnclaw"
path = "src/main.rs"
